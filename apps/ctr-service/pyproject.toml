[project]
name = "platform-ctr-service"
version = "0.1.0"
description = "Cuaderno de Trabajo Reflexivo - cadena criptografica append-only"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27",
    "platform-contracts",
    "platform-observability",
    # Usado en auth/dependencies.py (`from platform_ops import set_tenant_rls`).
    # Faltaba declararlo: funcionaba solo porque el workspace uv comparte un
    # unico venv entre los 11 servicios. Con venv por servicio (deploy aislado)
    # el import fallaba y con el se caia el `SET LOCAL app.current_tenant`.
    "platform-ops",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers[postgres,redis]>=4.8",
    "hypothesis>=6.108",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctr_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
markers = [
    "integration: requiere testcontainers",
]
