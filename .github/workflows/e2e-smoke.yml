name: E2E Smoke (API)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Corre en cada PR contra main + pushes a main. Para que sea efectivamente
  # obligatorio (bloquee merges si falla) hay que marcarlo como `Required check`
  # en GitHub Settings -> Branches -> main -> Branch protection rules.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  EMBEDDER: mock
  RERANKER: identity
  STORAGE: mock
  LLM_PROVIDER: mock


jobs:
  smoke:
    name: Smoke E2E API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # enable-cache desactivado: setup-uv cachea contra `**/uv.lock` y ese
          # archivo NO esta versionado (.gitignore). Con cache activada la action
          # aborta con "No file matched to [**/uv.lock]" antes de instalar nada.
          # Si algun dia se versiona el lockfile, volver a poner `true`.
          enable-cache: false

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Python deps
        run: uv sync --all-packages

      - name: Crear las 4 bases logicas
        # init-dbs.sql es la fuente de verdad del bootstrap (misma que dev): crea
        # las 4 bases + extensiones pgvector + la funcion apply_tenant_rls. La
        # PRIMERA migracion de academic (20260420_0001_initial_schema_with_rls.py)
        # invoca apply_tenant_rls(...), y el loop anterior con CREATE DATABASE
        # pelado NO la definia -> migrate-all.sh moria en la primera migracion con
        # "function apply_tenant_rls(unknown) does not exist" (reproducido y
        # verificado 2026-07-21). Correr init-dbs.sql destraba el step de migrations.
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -f infrastructure/postgres/init-dbs.sql

      - name: Aplicar migrations en las 4 bases
        env:
          ACADEMIC_DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/academic_main
          CTR_STORE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ctr_store
          CTR_DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ctr_store
          CLASSIFIER_DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/classifier_db
          CONTENT_DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/content_db
        # `uv run` es imprescindible: sin el, `scripts/migrate-all.sh` corre en
        # un shell que NO tiene el venv de uv en el PATH, y el script invoca
        # `alembic` a secas (no `uv run alembic`) — revienta con
        # "alembic: command not found" (exit 127), verificado 2026-07-20 en
        # el log de CI. Los demas steps de este workflow ya usan `uv run`
        # para lo mismo (ver "Seed Casbin policies" / "Seed 3 comisiones").
        run: uv run bash scripts/migrate-all.sh

      - name: Seed Casbin policies
        env:
          ACADEMIC_DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/academic_main
        run: uv run python -m academic_service.seeds.casbin_policies

      - name: Seed 3 comisiones (datos demo)
        env:
          ACADEMIC_DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/academic_main
          CTR_STORE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ctr_store
          CLASSIFIER_DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/classifier_db
        run: uv run python scripts/seed-3-comisiones.py

      - name: Levantar 11 servicios + workers en background
        env:
          REDIS_URL: redis://127.0.0.1:6379
          ACADEMIC_DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/academic_main
          CTR_STORE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ctr_store
          CTR_DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ctr_store
          CLASSIFIER_DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/classifier_db
          CONTENT_DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/content_db
          # Si apunta mal, governance/tutor no encuentran los prompts y devuelven
          # 500 al abrir el primer episodio (falla silenciosa hasta ese momento).
          PROMPTS_REPO_PATH: ${{ github.workspace }}/ai-native-prompts
          # NOTA: BYOK_MASTER_KEY queda sin setear a proposito — el smoke
          # test_create_revoke_flow se skippea, los demas BYOK tests siguen
          # cubriendo el SET LOCAL bug (que es lo critico).
          # FALTABA: sin esto el api-gateway arranca con `dev_trust_headers=False`
          # (default seguro en apps/api-gateway/src/api_gateway/config.py:109) y
          # rechaza con 401 {"detail":"Autenticación requerida"} los requests de
          # la suite smoke, que autentican mandando X-User-Id/X-Tenant-Id por
          # header en vez de un Bearer JWT (ver tests/e2e/smoke/conftest.py:6-13,
          # que documenta explicitamente que la suite asume
          # `dev_trust_headers=True`). Nombre de env var confirmado contra
          # pydantic-settings: sin `env_prefix` en `Settings.model_config`, el
          # field `dev_trust_headers` lee la env var `DEV_TRUST_HEADERS`
          # (case-insensitive).
          DEV_TRUST_HEADERS: "true"
        run: |
          mkdir -p /tmp/piloto-logs
          # El integrity-attestation-service (:8012) appendea a `attestations/`
          # (relativo al repo root, su CWD). Sin el dir, su health check
          # `attestation_dir_writable` da error -> status='error' -> el smoke
          # test_health_endpoint_responds_ready_or_degraded[integrity...] falla.
          # Creamos el dir para que el servicio arranque healthy en CI.
          mkdir -p attestations
          bash scripts/dev-start-all.sh
          echo "Esperando que los servicios respondan..."
          # OJO api-gateway: usamos /health/live (liveness), NO /health (readiness).
          # /health del gateway trata `keycloak_jwks` como check CRITICO
          # (routes/health.py:57) y devuelve 503 si Keycloak no responde. Este job
          # corre a proposito SIN Keycloak (DEV_TRUST_HEADERS=true — la suite smoke
          # autentica por headers X-*, no por JWT), asi que /health seria 503 eterno
          # y el arranque nunca se daria por listo. /health/live es 200 con el
          # proceso vivo, que es la condicion real que queremos gatear aca.
          # Verificado 2026-07-21 reproduciendo el stack sin Keycloak.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health/live > /dev/null && \
               curl -sf http://127.0.0.1:8002/health > /dev/null && \
               curl -sf http://127.0.0.1:8005/health > /dev/null && \
               curl -sf http://127.0.0.1:8007/health > /dev/null; then
              echo "Servicios listos."
              exit 0
            fi
            sleep 2
          done
          echo "Timeout esperando servicios — chequear .dev-logs/"
          for f in .dev-logs/*.log; do
            echo "=== $f ==="
            tail -30 "$f"
          done
          exit 1

      - name: Run smoke suite
        env:
          SMOKE_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432
          SMOKE_API_BASE_URL: http://127.0.0.1:8000
        run: make test-smoke

      - name: Subir logs como artifact (si fallo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-logs
          # upload-artifact resuelve paths contra el workspace root, no contra
          # el working-directory del job.
          path: |
            .dev-logs/
            /tmp/piloto-logs/
          if-no-files-found: ignore
          retention-days: 7
