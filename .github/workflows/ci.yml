name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  # PNPM_VERSION removido: la version la fija `packageManager` en package.json.


jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # enable-cache desactivado: setup-uv cachea contra `**/uv.lock` y ese
          # archivo NO esta versionado (.gitignore). Con cache activada la action
          # aborta con "No file matched to [**/uv.lock]" antes de instalar nada.
          # Si algun dia se versiona el lockfile, volver a poner `true`.
          enable-cache: false

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: uv sync --all-packages --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  check-docs:
    name: Docs drift (CLAUDE.md)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check CLAUDE.md numeric claims vs code
        run: python scripts/check-claude-md.py

      - name: Check vite.config UUIDs vs seed-3-comisiones
        # A24: detecta drift entre los UUIDs hardcoded en apps/web-*/vite.config.ts
        # (header x-user-id para dev mode sin Keycloak) y los UUIDs creados por
        # scripts/seed-3-comisiones.py. Sin este gate, un seed que no crea esos
        # UUIDs deja al frontend dev mudo silenciosamente (TareaSelector vacio).
        run: python scripts/check-vite-seed-sync.py

  typecheck-python:
    name: Typecheck Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # enable-cache desactivado: setup-uv cachea contra `**/uv.lock` y ese
          # archivo NO esta versionado (.gitignore). Con cache activada la action
          # aborta con "No file matched to [**/uv.lock]" antes de instalar nada.
          # Si algun dia se versiona el lockfile, volver a poner `true`.
          enable-cache: false

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: uv sync --all-packages --locked

      - name: mypy
        run: uv run mypy .

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` a proposito: package.json declara
      # `"packageManager": "pnpm@9.12.0"` y pnpm/action-setup@v4 falla con
      # "Multiple versions of pnpm specified" si ademas se le pasa una version.
      # El packageManager del package.json es la unica fuente de verdad.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo lint typecheck

  test-frontend:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` a proposito, mismo motivo que `lint-frontend`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # NADIE corria estos tests. `rg "vitest" .github/workflows/` daba CERO
      # hasta el 2026-08-27: los jobs de front eran `turbo lint typecheck` y
      # cuatro `build`, nada mas. Son 767 tests repartidos en seis paquetes
      # (desglose abajo), y por eso llegaron a haber 14 rojos viviendo en `main`
      # sin que nadie se enterara.
      #
      # Es el mismo agujero que el de los tests de integracion de Python, del
      # otro lado del monorepo: escribir tests que despues nadie ejecuta.
      #
      # OJO con la version de Node: bajo Node 26 el Web Storage nativo le gana
      # al de jsdom y `window.localStorage` queda `undefined` dentro de vitest,
      # lo que tira ~144 rojos FALSOS. El CI usa `NODE_VERSION: 20`, donde eso
      # no pasa. Si alguien sube la version del CI, esperar esos rojos y no
      # leerlos como regresiones.
      #
      # ---
      #
      # `-r` y no una lista de `--filter`, a proposito.
      #
      # Hasta el 2026-08-28 esto eran dos lineas —`@platform/ui` y
      # `@platform/web-student`— y todo lo demas quedaba afuera. El comentario
      # que justificaba la ausencia de `web-teacher` hablaba de "4 rojos REALES
      # pre-existentes en CorreccionesView.test.tsx"; esos 4 se arreglaron en
      # `ca798df` y el comentario sobrevivio, dejando 254 tests verdes fuera del
      # CI por una razon que ya no era cierta.
      #
      # Y no eran solo esos. Verificado corriendo `pnpm -r test` el 2026-08-28,
      # todo en verde:
      #
      #   packages/ui            117   (ya corria)
      #   apps/web-student       346   (ya corria)
      #   apps/web-teacher       254   <- afuera por el comentario vencido
      #   packages/auth-client    25   <- afuera y sin ninguna razon escrita
      #   packages/ctr-client     15   <- idem
      #   apps/web-admin          10   <- idem
      #                          ---
      #                          767   (antes corrian 463)
      #
      # Una lista explicita de filtros vuelve a tener el mismo problema el dia
      # que alguien agregue un paquete con tests: hay que acordarse de sumar la
      # linea, y nadie se entera si no se suma. `-r` corre el script `test` de
      # todo workspace que lo tenga y saltea los que no — un paquete nuevo entra
      # al CI por existir, no por acordarse.
      #
      # OJO con la version de Node (ver el bloque de arriba): bajo Node 26 el
      # Web Storage nativo le gana al de jsdom y aparecen ~144 rojos FALSOS.
      - run: pnpm -r test

  build-frontend:
    name: Build frontends (Vite)
    # Gate que faltaba: `lint-frontend` corre `turbo lint typecheck` (tsc --noEmit),
    # que NO equivale al `tsc -b && vite build` de infrastructure/frontends.Dockerfile.
    # Por eso errores TS que rompen el build de PROD pasaban CI y solo reventaban
    # en EasyPanel (dejando un bundle viejo servido). Acá corremos EXACTAMENTE los
    # mismos builds que el Dockerfile, asi un build roto falla en CI, no en prod.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` a proposito: package.json declara
      # `"packageManager": "pnpm@9.12.0"` y pnpm/action-setup@v4 falla con
      # "Multiple versions of pnpm specified" si ademas se le pasa una version.
      # El packageManager del package.json es la unica fuente de verdad.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @platform/web-admin   build
      - run: pnpm --filter @platform/web-teacher build
      - run: pnpm --filter @platform/web-student build
      - run: pnpm --filter @platform/web-landing build

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres real para que los tests `*_db.py` dejen de auto-skipearse.
    # Sin base, `skipif(not EVAL_TEST_DB_URL)` los apagaba a todos y el job
    # pasaba en verde sin haber tocado una fila.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # enable-cache desactivado: setup-uv cachea contra `**/uv.lock` y ese
          # archivo NO esta versionado (.gitignore). Con cache activada la action
          # aborta con "No file matched to [**/uv.lock]" antes de instalar nada.
          # Si algun dia se versiona el lockfile, volver a poner `true`.
          enable-cache: false

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: uv sync --all-packages --locked

      - name: Init DBs
        run: PGPASSWORD=postgres psql -h localhost -U postgres -f infrastructure/postgres/init-dbs.sql

      - name: Alembic upgrade (academic + evaluation)
        env:
          ACADEMIC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/academic_main
        # Se entra al directorio de cada servicio en vez de pasar `-c` desde la
        # raiz. Los dos `alembic.ini` declaran `script_location = alembic`, que
        # es RELATIVO al cwd — no al .ini. Desde la raiz, alembic busca
        # `./alembic`, no existe, y muere con:
        #
        #   FAILED: Path doesn't exist: alembic
        #
        # antes de tocar la base. Ese fallo dejo el job `Unit tests` en rojo en
        # `main` apenas se agrego este paso.
        run: |
          (cd apps/academic-service && uv run alembic upgrade head)
          (cd apps/evaluation-service && uv run alembic upgrade head)

      - name: Seed minimo para los tests con DB
        # ESTE STEP FALTABA, y era el agujero mas grande del job.
        #
        # Levantar Postgres y correr alembic deja la base CON ESQUEMA Y SIN UNA
        # SOLA FILA. Los tests `*_db.py` y los `test_scope_comision_*` no piden
        # "una base": piden una base SEMBRADA, y cuando no la encuentran se
        # apagan solos. Medido en `main` el 2026-08-28: **114 skipped**, de los
        # cuales 110 eran literalmente "la base esta vacia":
        #
        #    45  El seed no tiene tareas_practicas en dos comisiones distintas
        #    19  la base no tiene comisiones sembradas
        #    15  la base no tiene entregas
        #    12  la base necesita dos comisiones sembradas para distinguirlas
        #     9  la base no tiene comisiones/ejercicios sembrados
        #     5  la base no tiene TPs/comisiones
        #     3  la base no tiene ejercicios con rubrica
        #     2  Sin seed de tareas_practicas/comisiones para las FKs
        #     4  CTR_STORE_URL_FOR_RLS_TESTS no seteada   <- las unicas legitimas
        #
        # Los 45 primeros son los de scope de comision: los mismos que el
        # comentario del step de abajo dice haber agregado al glob porque "un
        # cambio de autorizacion entraba sin una sola verificacion automatica".
        # Estaban colectados y sin ejecutar. El job pasaba verde igual — un skip
        # no rompe nada, y por eso este agujero duro tanto.
        #
        # Mismo comando contra una base sembrada: 2015 passed / 5 skipped.
        # Son ~110 tests que el CI colectaba y nunca ejecutaba.
        #
        # `seed-ci-tests.py` siembra el minimo academico (2 comisiones, TPs en
        # las dos, entregas) y `seed-ejercicios-piloto.py` pone los 25
        # ejercicios con `rubrica` y test cases ocultos que pide
        # `test_activeia_payload_db.py`. NO se usa `seed-3-comisiones.py`: ese
        # ademas escribe en `ctr_store` y `classifier_db`, que este job no
        # migra. El detalle esta en el docstring de `seed-ci-tests.py`.
        env:
          ACADEMIC_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/academic_main
        run: |
          uv run python scripts/seed-ci-tests.py
          uv run python scripts/seed-ejercicios-piloto.py

      - name: Pytest (unit)
        # Coverage gate (GAP-9): documented target is 80% global, 85% pedagogy
        # (tutor/ctr/classifier) per CLAUDE.md > "Convenciones".
        # Current measured floor (sesión 2026-04-21): tutor=60%, ctr=63%,
        # classifier=85%. Gate is set at the global floor of 60% so CI is
        # actually enforced today; ratchet plan documented in BUGS-PILOTO.md
        # (GAP-9). If CI fails here, ADD TESTS — do NOT lower this number.
        # PATHS EXPLICITOS, no `-m "not integration"` a secas: pyproject.toml
        # tiene `testpaths = ["tests"]`, que apunta SOLO a tests/e2e/smoke/.
        # Sin los paths, este job colectaba 66 smoke tests y CERO de los 1364
        # unitarios reales (verificado con --collect-only 2026-07-20).
        # Mismos globs que `make test-fast`, que si funciona.
        env:
          # Sin esta var, los 6 archivos `*_db.py` del evaluation-service —unas
          # 1900 lineas— se auto-skipean. Ahi viven las verificaciones del CHECK
          # que sostiene la regla de oro del epic de Active-IA, del UNIQUE de
          # idempotencia, del aislamiento RLS y del derecho al olvido: todo eso
          # NO se verificaba en un PR.
          EVAL_TEST_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/academic_main
        # `apps/academic-service/tests/integration/` NO entra entero (hay 4
        # rojos viejos ahi, `test_tareas_practicas_templates_crud.py` mockea un
        # `svc.tp_repo` que ya no existe). Se agregan de a un archivo, y
        # `test_commit_sobre_http_real.py` tiene que estar: levanta uvicorn de
        # verdad y es lo unico que verifica que el cliente NO se queda con un
        # 201 sobre una escritura que no commiteo — un `ASGITransport` no puede
        # mostrar esa mitad, porque re-levanta la excepcion en vez de devolver
        # un status. Toma la DB de `ACADEMIC_DB_URL` o, en su defecto, de
        # `EVAL_TEST_DB_URL` (que este job ya exporta); sin ninguna se skipea.
        #
        # `apps/*/tests/*.py` ademas de `unit/`: los ~40 tests de scope de
        # comision del evaluation-service viven UN NIVEL ARRIBA de `tests/unit/`
        # y el glob viejo no los matcheaba, asi que un cambio de autorizacion
        # entraba sin una sola verificacion automatica.
        #
        # ── ROJOS CONOCIDOS, SIN TAPAR (2026-08-28) ──────────────────────────
        #
        # Medido contra una replica exacta de este job (postgres:16-alpine +
        # init-dbs.sql + los dos alembic + los dos seeds):
        #
        #            antes            despues
        #   passed    1905             2020
        #   skipped    114                5
        #   failed       3                1
        #   errors       3                3
        #   ejecutados 1908             2021
        #
        # Quedaban 4 rojos REALES. NO se apagaron, NO llevan `continue-on-error`
        # y NO se les aflojo el assert: eran verificaciones que nunca habian
        # corrido y lo que decian era cierto. Los 4 vivian en
        # `evaluation-service` y eran bugs DE TEST, no de producto. CERRADOS:
        #
        # 1) [CERRADO] `test_olvido_db.py::test_no_queda_NADA_que_describa_el_codigo_del_alumno`
        #    Assert vencido: exigia `artefacto_sha256 == ""` y
        #    `services/olvido.py` escribe `None` desde `44a20f9`. Ahora pide
        #    `is None` y NO `in (None, "")`: `""` rompe
        #    `uq_correccion_ia_idempotencia` cuando el alumno tiene dos
        #    correcciones sobre la misma entrega/orden/rubrica.
        #
        # 2-4) [CERRADO] `test_reconciliador_rls_db.py` — los 3 ERROR.
        #    `ForeignKeyViolationError` en `fk_correcciones_ia_entrega`: la
        #    fixture `dos_tenants_colgados` inventaba el `entrega_id`. Ahora crea
        #    la entrega (colgada de una TP y una comision reales) antes de
        #    insertar la correccion, y la borra al terminar.
        #
        # Los otros dos rojos que habia ANTES se arreglaron solos al sembrar,
        # y vale la pena mirarlos: eran los dos de `test_activeia_payload_db.py`
        # que en vez de skipear GRITAN
        # (`assert vistos_ocultos > 0, "la base no tiene casos ocultos: el test
        # no probo nada"`). De 114 tests sin datos, esos dos fueron los UNICOS
        # que avisaron. Los otros 112 se apagaron en silencio y el job seguia
        # verde. Ese patron es el correcto — copialo.
        run: >-
          uv run pytest
          apps/*/tests/*.py
          apps/*/tests/unit/
          apps/evaluation-service/tests/integration/
          apps/academic-service/tests/integration/test_casbin_matrix.py
          apps/academic-service/tests/integration/test_commit_sobre_http_real.py
          packages/*/tests/
          -m "not integration" --cov --cov-report=xml --cov-fail-under=60

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-sin-stack:
    name: Smoke sin stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Los tests marcados `sin_stack` levantan su propio doble HTTP en proceso:
    # no necesitan Postgres, ni Redis, ni los 13 servicios. Igual NADIE los
    # corria.
    #
    # `tests/e2e/smoke/test_smoke_activeia_doble.py` son 19 tests que verifican
    # el contrato con Active-IA —el 5xx que no puede volverse nota, el 401 que
    # re-loguea, el 200 sin nota— y caian en el hueco entre los dos jobs que si
    # existen:
    #
    #   - `make test-smoke` selecciona `-m smoke`, y este archivo lleva
    #     `pytestmark = pytest.mark.sin_stack`, no `smoke`. Salian en el
    #     "19 deselected" que aparece en el output de CADA corrida del workflow
    #     `E2E Smoke`, y nadie lo leyo como lo que era.
    #   - el job `Unit tests` mira `apps/*/tests/` y `packages/*/tests/`, y esto
    #     vive en `tests/e2e/smoke/`.
    #
    # Corriendolos a mano el 2026-08-28: **4 failed, 15 passed**. Los 4 seguian
    # mandando `nota_100` en el cuerpo del doble cuando `1b9ac8b` (27/08) ya
    # habia cambiado el campo del contrato a `nota` —string, no numero— y
    # actualizado los unit. Ese commit dice "187 en verde": cierto, porque estos
    # 19 no los corria nada.
    #
    # NO se les pone el marker `smoke` para meterlos en `make test-smoke`: eso
    # los ataria al gate de health de un stack que no necesitan. Job propio, 8
    # segundos, sin servicios.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # Mismo motivo que en los demas jobs: setup-uv cachea contra
          # `**/uv.lock`, que no esta versionado.
          enable-cache: false

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: uv sync --all-packages --locked

      - name: Pytest (sin_stack)
        # `--override-ini="testpaths="` porque `pyproject.toml` fija
        # `testpaths = ["tests"]` y el path explicito de abajo tiene que mandar.
        #
        # `-p no:randomly` NO se usa a proposito: estos tests comparten el
        # `GUION` a nivel de modulo, y que el orden varie es parte de lo que
        # verifica que la fixture lo limpie bien.
        run: >-
          uv run pytest tests/e2e/smoke/ -m sin_stack -v
          --override-ini="testpaths="

  # NOTA: el job `test-integration` (Integration tests / testcontainers) se
  # removio a proposito (2026-07-21). Moria en "Alembic upgrade academic" por el
  # bug de `current_setting('app.current_tenant')` sin `, true` (falla al validar
  # el FK tareas_practicas->unidades como academic_user no-superuser bajo FORCE
  # RLS), y aun destrabando eso, 4 fixtures viejas siguen rotas por la divergencia
  # ADR-016/ADR-042 (decision humana pendiente). Reintroducir este job cuando se
  # arregle el bug de RLS de las migraciones academic + esa deuda de fixtures.

  test-rls:
    name: RLS isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: uv sync --all-packages --locked

      - name: Crear ctr_store y el usuario non-superuser
        # CRITICO: los tests DEBEN correr con un usuario NOBYPASSRLS. Con
        # `postgres` (superuser) las policies se bypassean y los 4 tests pasan
        # sin verificar NADA — el propio Makefile:109 lo advierte.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE ctr_store;"
          psql -h localhost -U postgres -c "CREATE ROLE app_runtime LOGIN PASSWORD 'app_runtime' NOSUPERUSER NOBYPASSRLS;"
          psql -h localhost -U postgres -d ctr_store -c "GRANT ALL ON SCHEMA public TO app_runtime;"

      - name: Crear función apply_tenant_rls en ctr_store
        # FALTABA: la migración inicial del ctr-service llama
        # `SELECT apply_tenant_rls('<tabla>')` (ver
        # apps/ctr-service/alembic/versions/20260720_0001_ctr_initial_schema.py:122),
        # pero esa función no viene con Postgres — la crea
        # infrastructure/postgres/init-dbs.sql al bootstrapear el contenedor
        # dev (docker-entrypoint-initdb.d), que este job NO corre (crea
        # ctr_store a mano arriba). Sin este step, `alembic upgrade head`
        # explota con `UndefinedFunctionError: function apply_tenant_rls(unknown)
        # does not exist`. Misma definición exacta que el bloque `\c ctr_store`
        # de init-dbs.sql — mantenerlas sincronizadas si esa cambia.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ctr_store <<'SQL'
          CREATE OR REPLACE FUNCTION apply_tenant_rls(table_name text)
          RETURNS void AS $$
          BEGIN
              EXECUTE format('ALTER TABLE %I ENABLE ROW LEVEL SECURITY', table_name);
              EXECUTE format('ALTER TABLE %I FORCE ROW LEVEL SECURITY', table_name);
              EXECUTE format(
                  'CREATE POLICY tenant_isolation ON %I USING (tenant_id = current_setting(''app.current_tenant'', true)::uuid)',
                  table_name
              );
          END;
          $$ LANGUAGE plpgsql;
          SQL

      - name: Migrar ctr_store
        env:
          CTR_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ctr_store
          CTR_STORE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ctr_store
        run: cd apps/ctr-service && uv run alembic upgrade head

      - name: Grants sobre las tablas migradas
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ctr_store -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_runtime;"
          psql -h localhost -U postgres -d ctr_store -c "GRANT USAGE ON ALL SEQUENCES IN SCHEMA public TO app_runtime;"

      - name: Run RLS tests
        # PATH EXPLICITO: `-m "integration" -k "rls or tenant"` seleccionaba CERO
        # tests (esos archivos no llevan el marker) y salia con exit 0 — verde
        # sin ejecutar nada. Sin la env var, ademas, los 4 tests se SKIPEAN en
        # silencio. Este job no verificaba absolutamente nada.
        env:
          CTR_STORE_URL_FOR_RLS_TESTS: postgresql+asyncpg://app_runtime:app_runtime@localhost:5432/ctr_store
        run: uv run pytest packages/platform-ops/tests/test_rls_postgres.py -v

  migrations-dry-run:
    name: Migrations dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: uv sync --all-packages --locked

      - name: Init DBs
        run: PGPASSWORD=postgres psql -h localhost -U postgres -f infrastructure/postgres/init-dbs.sql

      - name: Alembic upgrade academic
        # working-directory a nivel step PISA el default del workflow y es
        # relativo al workspace root — por eso lleva el prefijo completo.
        working-directory: apps/academic-service
        env:
          ACADEMIC_DB_URL: postgresql+asyncpg://academic_user:academic_pass@localhost:5432/academic_main
        run: uv run alembic upgrade head || echo "No migrations yet (expected in F0)"

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      [
        lint-python,
        typecheck-python,
        lint-frontend,
        test-frontend,
        test-unit,
        test-sin-stack,
      ]
    strategy:
      matrix:
        service:
          - academic-service
          - ai-gateway
          - analytics-service
          - api-gateway
          - classifier-service
          - content-service
          - ctr-service
          - evaluation-service
          - governance-service
          - tutor-service
          # NOTE: integrity-attestation-service excluded (no Dockerfile yet,
          # ADR-021 — infra institucional separada en piloto, vive en VPS UTN).
          # NOTE: identity-service deprecated (ADR-041) — auth via api-gateway + Casbin.
          # NOTE: enrollment-service deprecated (ADR-030) — bulk-import en academic-service.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          # El context DEBE ser la raiz del monorepo, no la carpeta del servicio:
          # los Dockerfiles corren `uv sync --all-packages`, que necesita el
          # uv.lock y packages/ del workspace completo. Con `context: apps/<svc>`
          # esos archivos no estan en el contexto de build.
          # Alineado con infrastructure/docker-compose.prod.yml (`context: ..`)
          # y con EasyPanel, que son los que hoy buildean prod.
          # OJO: al colapsar el wrapper, la "Ruta de compilacion" de CADA servicio
          # en EasyPanel debe pasar de `/AI-NativeV3-main` a `/`.
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: platform/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          # La dev key Ed25519 del integrity-attestation-service es publica y
          # commiteada a proposito (ADR-021) — ver .trivyignore.yaml, que la
          # ignora SOLO por su ruta (cualquier otra private key sigue fallando).
          trivyignores: ".trivyignore.yaml"
