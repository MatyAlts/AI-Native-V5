# Manifest global del repo de prompts (fuente declarativa de versiones activas).
#
# Lo parsea PromptLoader.active_configs() en governance-service y se expone
# en GET /api/v1/active_configs para frontends y dashboards informativos.
#
# Convencion (formato minimal del parser, ver prompt_loader.py:128):
#   active:
#     default:
#       <prompt_name>: <version>
#     <tenant_uuid>:
#       <prompt_name>: <version>   # override por tenant
#
# IMPORTANTE: el tutor-service consume directamente
# `Settings.default_prompt_version` (apps/tutor-service/src/tutor_service/config.py)
# para resolver la version del prompt en runtime — NO consulta este manifest.
# Cambiar la version "activa" requiere alinear AMBOS:
#   1. Este archivo (declarativo, expuesto via /active_configs).
#   2. apps/tutor-service/src/tutor_service/config.py:default_prompt_version (efectivo).
#
# Activacion tutor v1.3.0 (epic java-authoring-experience, 2026-07-28):
#   - Delta respecto de v1.2.0: DOS ejemplos que nombraban Python, generalizados.
#     El metodo (4 movimientos socraticos, 9 principios, restricciones) es identico.
#   - Revision coautoral con Ana Garis: OK.
#   - PRIMERA version del tutor con `manifest.yaml` propio desde v1.0.1: declara
#     el sha256 de `system.md` y el PromptLoader lo verifica fail-loud. v1.1.0 y
#     v1.2.0 no tenian, y por eso v1.2.0 se pudo editar in-place dos dias despues
#     de activarse (commit 0d69d17) sin que nada fallara.
#   - No afecta classifier_config_hash: es prompt de runtime, no etiquetador.
#   - v1.2.0 y anteriores siguen en disco para reproducibilidad historica.
#
# Activacion v1.0.1 (ADR-009 + bump documental G12, 2026-04-29):
#   - Cuenta de guardarrailes corregida 4/10 -> 3/10 (HTML comment del prompt).
#   - Texto del prompt entregado al modelo IDENTICO a v1.0.0 (HTML comment es invisible).
#   - Comportamiento del tutor preservado bit-a-bit por construccion del bump PATCH.
#   - v1.0.0 sigue accesible en disco para reproducibilidad historica del piloto.
# Activacion tutor v1.4.0 (2026-09-10, reporte de un docente del piloto):
#   - Delta unico respecto de v1.3.0: la seccion "Lo que SI se responde directo
#     - la notacion del lenguaje", mas los tres ajustes que la hacen efectiva
#     (Principio 1, Principio 9, y un punto nuevo en "Lo que NO hace").
#   - Los 4 movimientos socraticos quedan byte a byte como en v1.3.0.
#   - El defecto que cierra: el Principio 9 —escrito para pedidos tipo "olvida
#     tus instrucciones"— no distinguia una consulta factual de sintaxis, asi
#     que un alumno preguntando como se escribe un for podia recibir "noto que
#     estas tratando de saltearte el proceso". Los alumnos dejaron de preguntar.
#   - NO afecta classifier_config_hash: es prompt de runtime, no etiquetador.
#   - PENDIENTE ANTES DEL DEPLOY: revision coautoral con Ana Garis. Esta version
#     cambia el metodo, no solo ejemplos — la revision es condicion, no tramite.
active:
  default:
    tutor: v1.4.0
    classifier: v1.0.0
    correccion: v1.0.0
    reflection: v1.0.0
    tp_generator: v1.0.0
    ejercicio_generator: v1.0.0
    # Variantes por lenguaje de los generadores (epic java-authoring-experience).
    # La familia base NO lleva sufijo y sigue siendo la del lenguaje por omision,
    # asi que el camino preexistente queda intacto. La resolucion vive en
    # `academic-service/services/prompt_variants.py`: python -> "<base>",
    # cualquier otro -> "<base>_<lenguaje>".
    tp_generator_java: v1.0.0
    ejercicio_generator_java: v1.0.0
