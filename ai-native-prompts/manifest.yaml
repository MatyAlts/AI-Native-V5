# Manifest global del repo de prompts (fuente declarativa de versiones activas).
#
# Lo parsea PromptLoader.active_configs() en governance-service y se expone
# en GET /api/v1/active_configs para frontends y dashboards informativos.
#
# Convencion (formato minimal del parser, ver prompt_loader.py:128):
#   active:
#     default:
#       <prompt_name>: <version>
#     <tenant_uuid>:
#       <prompt_name>: <version>   # override por tenant
#
# IMPORTANTE: el tutor-service consume directamente
# `Settings.default_prompt_version` (apps/tutor-service/src/tutor_service/config.py)
# para resolver la version del prompt en runtime — NO consulta este manifest.
# Cambiar la version "activa" requiere alinear AMBOS:
#   1. Este archivo (declarativo, expuesto via /active_configs).
#   2. apps/tutor-service/src/tutor_service/config.py:default_prompt_version (efectivo).
#
# Activacion tutor v1.6.0 (2026-09-28, hallazgo de contexto real):
#   - Delta respecto de v1.5.0: tres correcciones a lo que el prompt dice que el
#     tutor conoce, contra lo que tutor_core.py realmente le inyecta.
#   - C1: el prompt afirmaba "vos no conoces el enunciado completo" cuando el
#     tutor SI lo recibe al abrir el episodio (best-effort). Corregido en la
#     seccion "Contexto del TP", conservando intacta "NO supongas requisitos
#     que el enunciado no establecio".
#   - C2 (seccion nueva): el codigo del alumno le llega numerado por linea en
#     cada turno, pero el prompt nunca lo mencionaba, asi que el tutor le
#     pedia al alumno que lo pegue — en una plataforma que bloquea copiar y
#     pegar. Ahora prohibe pedir codigo pegado y dice que hacer cuando
#     todavia no hay codigo (invitar a escribir, no a pegar).
#   - C3: prohibicion nueva de derivar a Google, ChatGPT o Stack Overflow —
#     comportamiento emergente medido en produccion el 2026-09-28 (el prompt
#     no los mencionaba en ninguna linea).
#   - Metodo socratico, tono, principios, banco N1-N4 y misconceptions quedan
#     intactos. Eso SI esta verificado mecanicamente, pero por tests heredados
#     (test_prompt_confirmacion_al_acertar.py y test_prompt_notacion_vs_
#     razonamiento.py, que leen la version activa): 42 rojos contra un prompt
#     reducido a las frases ancladas. No lo verifica ningun test de este bump.
#   - Lo que NO esta verificado: que esto sea "correccion de hechos falsos y no
#     autoria pedagogica". La auditoria del 2026-09-28 mostro que C2 agrega
#     directivas de conducta tutorial con su fundamento y que C3 entra en la
#     seccion de metodo. Nadie con criterio pedagogico leyo los tres textos.
#   - No afecta classifier_config_hash: es prompt de runtime, no etiquetador.
#   - Episodios ya abiertos NO toman esta version: el prompt queda pinneado al
#     evento seq 0 del episodio (tutor_core.py:1218-1234), asi que el defecto
#     medido sigue vivo en ellos hasta que cierren.
#   - v1.5.0 y anteriores siguen en disco para reproducibilidad historica.
#   - Revision coautoral con Ana Garis: OK (2026-09-28). Leyo los cuatro textos
#     nuevos (C1 reescrito, la seccion del codigo del alumno, y los bullets C3 y
#     C4) y los aprobo sin cambios. El gate que este bloque declaraba bloqueante
#     queda cerrado. En la misma revision cerro tambien los de v1.4.0 y v1.5.0.
#
# Activacion tutor v1.3.0 (epic java-authoring-experience, 2026-07-28):
#   - Delta respecto de v1.2.0: DOS ejemplos que nombraban Python, generalizados.
#     El metodo (4 movimientos socraticos, 9 principios, restricciones) es identico.
#   - Revision coautoral con Ana Garis: OK.
#   - PRIMERA version del tutor con `manifest.yaml` propio desde v1.0.1: declara
#     el sha256 de `system.md` y el PromptLoader lo verifica fail-loud. v1.1.0 y
#     v1.2.0 no tenian, y por eso v1.2.0 se pudo editar in-place dos dias despues
#     de activarse (commit 0d69d17) sin que nada fallara.
#   - No afecta classifier_config_hash: es prompt de runtime, no etiquetador.
#   - v1.2.0 y anteriores siguen en disco para reproducibilidad historica.
#
# Activacion v1.0.1 (ADR-009 + bump documental G12, 2026-04-29):
#   - Cuenta de guardarrailes corregida 4/10 -> 3/10 (HTML comment del prompt).
#   - Texto del prompt entregado al modelo IDENTICO a v1.0.0 (HTML comment es invisible).
#   - Comportamiento del tutor preservado bit-a-bit por construccion del bump PATCH.
#   - v1.0.0 sigue accesible en disco para reproducibilidad historica del piloto.
# Activacion tutor v1.5.0 (2026-09-21, la critica mas repetida del piloto):
#   - Delta unico respecto de v1.4.0: la seccion "Cerrar el lazo - cuando el
#     estudiante acierta", mas los tres ajustes que la hacen efectiva (la Ironia
#     acotada al caso sin razon, el Principio 5 reescrito como "Confirmar cuando
#     acierta", y dos puntos reformulados en "Lo que NO hace el tutor").
#   - Los 4 movimientos socraticos quedan byte a byte, y la seccion de notacion
#     de v1.4.0 tambien (hay un test que lo verifica: copiar un prompt y editarlo
#     a mano es justo como se pierde un fix anterior sin que nada avise).
#   - El defecto que cierra: los cuatro movimientos son TODOS de apertura —la
#     ironia suspende, la mayeutica pregunta, el elenchos contradice, la aporia
#     sostiene el bloqueo— y ninguno cierra. El estudiante que ya razono bien
#     recibia otra pregunta en vez de un "si, eso es lo que pasa".
#   - Lo mas fuerte del diagnostico: el cierre YA estaba modelado en los datos
#     del ejercicio (heuristica_cierre, senal_comprension del banco socratico,
#     ADR-048), los dos inyectados al system message. La plataforma sabia
#     DETECTAR que el estudiante entendio y el prompt no tenia ninguna accion
#     asociada a detectarlo.
#   - NO debilita GP1 ni GP2: GP1 protege el razonamiento, no el cierre; GP2
#     gobierna lo que el estudiante todavia no penso, la confirmacion lo que ya
#     penso bien. Dominios disjuntos, declarado en la propia seccion.
#   - NO afecta classifier_config_hash: es prompt de runtime, no etiquetador.
#   - Revision coautoral con Ana Garis: OK (2026-09-28). Esta version le agrega
#     un movimiento al metodo, asi que la revision era condicion y no tramite.
#     Quedo pendiente desde el 2026-09-21 y se cerro junto con la de v1.6.0.
#     Es la version que estaba corriendo en produccion mientras tanto.
#
# Activacion tutor v1.4.0 (2026-09-10, reporte de un docente del piloto):
#   - Delta unico respecto de v1.3.0: la seccion "Lo que SI se responde directo
#     - la notacion del lenguaje", mas los tres ajustes que la hacen efectiva
#     (Principio 1, Principio 9, y un punto nuevo en "Lo que NO hace").
#   - Los 4 movimientos socraticos quedan byte a byte como en v1.3.0.
#   - El defecto que cierra: el Principio 9 —escrito para pedidos tipo "olvida
#     tus instrucciones"— no distinguia una consulta factual de sintaxis, asi
#     que un alumno preguntando como se escribe un for podia recibir "noto que
#     estas tratando de saltearte el proceso". Los alumnos dejaron de preguntar.
#   - NO afecta classifier_config_hash: es prompt de runtime, no etiquetador.
#   - Revision coautoral con Ana Garis: OK (2026-09-28). Esta version cambia el
#     metodo y no solo ejemplos, asi que la revision era condicion y no tramite.
#     Quedo pendiente desde el 2026-09-10 y se cerro junto con la de v1.6.0.
active:
  default:
    tutor: v1.6.0
    classifier: v1.0.0
    correccion: v1.0.0
    reflection: v1.0.0
    tp_generator: v1.0.0
    ejercicio_generator: v1.0.0
    # Variantes por lenguaje de los generadores (epic java-authoring-experience).
    # La familia base NO lleva sufijo y sigue siendo la del lenguaje por omision,
    # asi que el camino preexistente queda intacto. La resolucion vive en
    # `academic-service/services/prompt_variants.py`: python -> "<base>",
    # cualquier otro -> "<base>_<lenguaje>".
    tp_generator_java: v1.0.0
    ejercicio_generator_java: v1.0.0
